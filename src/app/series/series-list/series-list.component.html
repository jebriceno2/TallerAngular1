<div class="container mt-4">
  <div class="row">
    <!-- Tabla -->
    <div class="col-md-8">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Channel</th>
            <th>Seasons</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let serie of series" (click)="onSelect(serie)" style="cursor: pointer;">
            <td>{{ serie.id }}</td>
            <td class="text-primary">{{ serie.name }}</td>
            <td>{{ serie.channel }}</td>
            <td>{{ serie.seasons }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Detalle -->
    <div class="col-md-4" *ngIf="selectedSerie">
      <div class="card">
        <img [src]="selectedSerie.poster" class="card-img-top" alt="poster" />
        <div class="card-body">
          <h5 class="card-title">{{ selectedSerie.name }}</h5>
          <p class="card-text">{{ selectedSerie.description }}</p>
        </div>
      </div>
    </div>
  </div>
  <div class="mt-3 text-start fw-bold">
    Promedio de temporadas: {{ promedioTemporadas | number:'1.1-2' }}
  </div>
</div>
